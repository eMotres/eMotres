# Legacy marketing URLs on aerostator.com — domain swap of 2026-09-28.
#
# aerostator.com used to serve this marketing site and now serves the
# engineering app. Without these rules every indexed page (shop, product
# cards, technology, the ZH mirror, the old WordPress paths) answered 200
# with the app, so Google saw the content of each page replaced instead of
# moved, and none of the old domain's authority reached emotres.com.
#
# Lives on the Hetzner box inside the aerostator.com :443 server block of
# /etc/nginx/sites-enabled/aerostator. The app keeps "/", "/api", "/forms"
# and its assets — none of them match the list below.

location ~ ^/(shop|technology|news|blog|faq|contact|contact-us|get-a-quote|motor-development-services|privacy-policy|terms-conditions|delivery-returns|order-confirmed|zh|service|services|motors|product|product-category|term-conditions|cart|checkout|my-account|inrunner-motor-with-tangential-magnets-polarization-vs-outrunner-with-radial-magnets-polarization|radial-go-and-axial-motors-technology)(/|$) {
    return 301 https://emotres.com$request_uri;
}

location = /sitemap.xml {
    return 301 https://emotres.com/sitemap.xml;
}

# Must stay crawlable: if this domain were disallowed, Google could never see
# the 301s above and the old pages would just drop out of the index.
# Serves /var/www/aerostator/robots.txt — "User-agent: *" + "Allow: /".
location = /robots.txt {
    root /var/www/aerostator;
}
