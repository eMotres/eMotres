# Legacy marketing URLs on aerostator.com — domain swap of 2026-09-28.
#
# aerostator.com used to serve this marketing site and now serves the
# engineering app. Without these rules every indexed page (shop, product
# cards, technology, the ZH mirror, the old WordPress paths) answered 200
# with the app, so Google saw the content of each page replaced instead of
# moved, and none of the old domain's authority reached emotres.com.
#
# Lives on the Hetzner box inside the aerostator.com :443 server block of
# /etc/nginx/sites-enabled/aerostator. The app keeps "/", "/api", "/forms"
# and its assets — none of them match the list below.
# /motors is NOT in the list (2026-10-20): it is the app's catalogue tab, and a
# reload or a shared link to it must stay on aerostator.com.

location ~ ^/(shop|technology|news|blog|faq|contact|contact-us|get-a-quote|motor-development-services|privacy-policy|terms-conditions|delivery-returns|order-confirmed|zh|service|services|product|product-category|term-conditions|cart|checkout|my-account|inrunner-motor-with-tangential-magnets-polarization-vs-outrunner-with-radial-magnets-polarization|radial-go-and-axial-motors-technology)(/|$) {
    return 301 https://emotres.com$request_uri;
}

# /sitemap.xml and /robots.txt are no longer overridden here (2026-10-14): the app on aerostator.com serves
# its own pre-rendered landing, sitemap and robots.txt (allow all, incl. AI crawlers), so Google still sees the 301s above.
